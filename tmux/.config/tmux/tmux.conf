# ~/.config/tmux/tmux.conf

# ==================================
# Config directory
# ==================================

run-shell '
    CONFIG_DIRECTORY="${XDG_CONFIG_HOME:-$HOME/.config}/tmux"
    PLUGINS_DIRECTORY="$CONFIG_DIRECTORY/plugins"

    tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$PLUGINS_DIRECTORY"

    # Quick config reload on prefix + r
    tmux bind r source-file "$CONFIG_DIRECTORY/tmux.conf"
'

# ==================================
# Keybindings
# ==================================

# Leader key is `
unbind b
set -g prefix `
bind ` send-prefix # Hitting double backtick sends an actual backtick

# Remove confirmation from kill pane 
bind-key x kill-pane
# Remove confirmation from kill window
bind-key & kill-window

# Vim style window swapping
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key C-h resize-pane -L 5
bind-key C-j resize-pane -D 5
bind-key C-k resize-pane -U 5
bind-key C-l resize-pane -R 5

bind-key L split-window -h
bind-key J split-window -v 

# Popups
# Floating lazygit
bind g display-popup \
    -d "#{pane_current_path}" \
    -w 80% \
    -h 80% \
    -E lazygit

# Fuzzy find keybindings
bind ? display-popup -B -E \
    "tmux list-keys -N | FZF_DEFAULT_OPTS=\"\$FZF_DEFAULT_OPTS\" fzf --header='Tmux Keybindings'"

# ==================================
# Config Options
# ==================================

# Enable mouse controls
set -g mouse on
set -g escape-time 0

# Index from 1 for easier keyboard reach (0 is far away)
set -g base-index 1
set -g pane-base-index 1

# When you delete a window, renumber them
set -g renumber-windows on

# Decrease duration of status messages
set-option -g display-time 1000

# ==================================
# UI Config
# ==================================

# Colour palette
WHITE="#FDFFF1"
BLACK="#272822"
PINK="#F92672"
GREEN="#A6E22E"
YELLOW="#E6DB74"
ORANGE="#fd971f"
PURPLE="#ae81ff"
CYAN="#66D9EF"
GREY="#6e7066"

FG="${WHITE}"
BG="${BLACK}"

set -g status-position top
set -g status-style "bg=#{BG},fg=#{FG}"
set -g status-justify absolute-centre

# Session name: left side, Monokai green
# set -g status-left-length 40
set -g status-left " #S"

# # Right side: hide session name, machine name, and time
set -g status-right "#{?client_prefix,#[fg=#{GREEN}][P] ,}"

# # Window Status
set -g window-status-separator "  "

# # Inactive windows: muted grey
set -g window-status-format "#[fg=${GREY}]• \
#[fg=${FG}]#W"
set -g window-status-current-format "• #W"

# # Active window: bold pink, no underline
set -g window-status-current-style "bold,nounderscore"
set -g window-status-style "nounderscore"

# Popup styling
set -g popup-style 'fg=default,bg=default'
set -g popup-border-style 'fg=#75715E,bg=default'

set -g pane-border-lines single

# ==================================
# Plugins
# ==================================

# Session resurrection
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Register plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Tpm init
run '~/.config/tmux/plugins/tpm/tpm'
