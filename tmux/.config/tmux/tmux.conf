# TPM plugin directory
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Rebind Leader + r to reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf
# Remove confirmation from kill pane 
bind-key x kill-pane
# Remove confirmation from kill window
bind-key & kill-window

# Leader key is Ctrl+s
set -g prefix C-space

# Enable mouse controls
set -g mouse on

# Index from 1 for easier keyboard reach (0 is far away)
set -g base-index 1

# Vim style window swapping
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ==================================
# Status Bar
# ==================================

set -g status-position top
set -g status-style "bg=#272822,fg=#F8F8F2"

# Session name: left side, Monokai green
set -g status-left-length 40
set -g status-left "#[fg=#A6E22E,bold] #S #[fg=#75715E]│"

# Right side: hide session name, machine name, and time
set -g status-right ""

# ==================================
# Window Status
# ==================================

set -g window-status-separator ""

# Inactive windows: muted grey
set -g window-status-format " #[fg=#75715E]#I:#W │"

# Active window: bold pink, no underline
set -g window-status-current-format "#[fg=#F8F8F2,bold,bg=#F92672] #I:#W #[fg=#75715E,bg=#272822]│"
set -g window-status-current-style "bg=#272822,bold,nounderscore"
set -g window-status-style "bg=#272822,nounderscore"